name: Authly Secure Build

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build, Obfuscate and Encrypt Authly
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --------------------------------------------------
      # 3. Install dependencies in the workspace
      # --------------------------------------------------
      - name: Install build tools
        run: |
          npm init -y
          npm install --save-exact \
            javascript-obfuscator \
            cheerio \
            html-minifier-terser

      # --------------------------------------------------
      # 4. Validate source and password
      # --------------------------------------------------
      - name: Validate input
        env:
          SOURCE_BACKUP_PASSWORD: ${{ secrets.SOURCE_BACKUP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s index.html ]; then
            echo "::error::index.html is missing or empty."
            exit 1
          fi

          if [ -z "${SOURCE_BACKUP_PASSWORD:-}" ]; then
            echo "::error::SOURCE_BACKUP_PASSWORD secret is missing."
            exit 1
          fi

          if [ "${#SOURCE_BACKUP_PASSWORD}" -lt 8 ]; then
            echo "::error::Backup password must contain at least 8 characters."
            exit 1
          fi

          echo "Source and password checks passed."

      # --------------------------------------------------
      # 5. Create output directory and source copy
      # --------------------------------------------------
      - name: Prepare output
        run: |
          mkdir -p dist
          cp index.html dist/source.html

      # --------------------------------------------------
      # 6. Obfuscate inline JavaScript and minify HTML/CSS
      # --------------------------------------------------
      - name: Build obfuscated website
        shell: bash
        run: |
          set -euo pipefail

          cat > build.mjs <<'NODE'
          import fs from "node:fs";
          import * as cheerio from "cheerio";
          import JavaScriptObfuscator from "javascript-obfuscator";
          import { minify } from "html-minifier-terser";

          const input = fs.readFileSync("index.html", "utf8");

          const $ = cheerio.load(input, {
            decodeEntities: false
          });

          let obfuscatedCount = 0;

          $("script").each((_, element) => {
            const script = $(element);
            const src = script.attr("src");
            const type = (script.attr("type") || "")
              .trim()
              .toLowerCase();

            // Leave external scripts unchanged.
            if (src) return;

            // Preserve JSON, import maps, templates and other
            // non-JavaScript script blocks.
            const supportedTypes = [
              "",
              "text/javascript",
              "application/javascript",
              "module"
            ];

            if (!supportedTypes.includes(type)) return;

            const original = script.html();

            if (!original || !original.trim()) return;

            try {
              const result = JavaScriptObfuscator.obfuscate(
                original,
                {
                  compact: true,
                  stringArray: true,
                  stringArrayThreshold: 0.65,
                  identifierNamesGenerator: "hexadecimal",
                  renameGlobals: false,
                  controlFlowFlattening: false,
                  deadCodeInjection: false,
                  selfDefending: false,
                  unicodeEscapeSequence: false
                }
              );

              script.text(result.getObfuscatedCode());
              obfuscatedCount++;
            } catch (error) {
              console.error(
                "JavaScript obfuscation failed:",
                error.message
              );

              process.exitCode = 1;
            }
          });

          if (process.exitCode) {
            process.exit(1);
          }

          const processedHtml = $.html();

          const output = await minify(processedHtml, {
            collapseWhitespace: true,
            removeComments: true,
            removeRedundantAttributes: true,
            removeScriptTypeAttributes: false,
            removeStyleLinkTypeAttributes: false,
            minifyCSS: true,
            minifyJS: false
          });

          fs.writeFileSync(
            "dist/website.html",
            output,
            "utf8"
          );

          console.log(
            `Obfuscated ${obfuscatedCount} inline JavaScript block(s).`
          );

          console.log("Created dist/website.html");
          NODE

          node build.mjs

      # --------------------------------------------------
      # 7. Encrypt original source using AES-256-GCM
      # --------------------------------------------------
      - name: Encrypt original source
        env:
          SOURCE_BACKUP_PASSWORD: ${{ secrets.SOURCE_BACKUP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cat > encrypt.mjs <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";

          const password = process.env.SOURCE_BACKUP_PASSWORD;

          if (!password || password.length < 8) {
            throw new Error(
              "SOURCE_BACKUP_PASSWORD must contain at least 8 characters."
            );
          }

          const input = fs.readFileSync("index.html");

          // Random salt and AES-GCM nonce.
          const salt = crypto.randomBytes(16);
          const iv = crypto.randomBytes(12);

          // Derive a 256-bit key from the password.
          const key = crypto.pbkdf2Sync(
            password,
            salt,
            600000,
            32,
            "sha256"
          );

          const cipher = crypto.createCipheriv(
            "aes-256-gcm",
            key,
            iv
          );

          const ciphertext = Buffer.concat([
            cipher.update(input),
            cipher.final()
          ]);

          const authenticationTag = cipher.getAuthTag();

          // Binary format:
          // 8 bytes  : magic/version marker
          // 16 bytes : salt
          // 12 bytes : IV
          // 16 bytes : GCM authentication tag
          // remaining: ciphertext
          const header = Buffer.from("AUTHLY01", "ascii");

          const encryptedFile = Buffer.concat([
            header,
            salt,
            iv,
            authenticationTag,
            ciphertext
          ]);

          fs.writeFileSync(
            "dist/authly-source.enc",
            encryptedFile
          );

          // Clear key bytes from this buffer when possible.
          key.fill(0);

          console.log(
            "Created dist/authly-source.enc"
          );
          NODE

          node encrypt.mjs

      # --------------------------------------------------
      # 8. Verify output files
      # --------------------------------------------------
      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/source.html
          test -s dist/website.html
          test -s dist/authly-source.enc

          echo "All three output files were generated:"
          ls -lh dist/

      # --------------------------------------------------
      # 9. Upload downloadable artifact
      # --------------------------------------------------
      - name: Upload Authly build
        uses: actions/upload-artifact@v4
        with:
          name: Authly-Secure-Build
          path: dist/
          if-no-files-found: error
          retention-days: 30
