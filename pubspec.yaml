name: authly
description: "Authly - Production-grade offline-first Flutter 2FA Authenticator"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  cryptography: ^2.7.0
  base32: ^2.1.4
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^6.0.4
  local_auth: ^2.3.0
  shared_preferences: ^2.3.3
  file_picker: ^8.1.7
  share_plus: ^10.1.3
  uuid: ^4.5.1
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/authly_logo.png
